name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # lets you run it by hand from the Actions tab

permissions:
  contents: read

# A newer push cancels the older run for the same branch
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the tests
        run: npm test